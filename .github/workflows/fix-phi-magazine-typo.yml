name: Fix Phi magazine type typo

on:
  push:
    paths:
      - .github/workflows/fix-phi-magazine-typo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/PhiMagazineV4.tsx')
          s=p.read_text()
          if 'CommonsImae' not in s:
              raise SystemExit('CommonsImae marker not found')
          p.write_text(s.replace('CommonsImae','CommonsImage'))
          PY
          rm .github/workflows/fix-phi-magazine-typo.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiMagazineV4.tsx .github/workflows/fix-phi-magazine-typo.yml
          git commit -m "Fix Phi magazine image type [skip ci]"
          git push
