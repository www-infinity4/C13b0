name: Fix semantic token type

on:
  push:
    paths:
      - .github/workflows/fix-semantic-token-type.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix token array typing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/phi-semantic-expansion.ts')
          s=p.read_text()
          old='const rawTokens = (value: string) => clean(value).toLowerCase().match(/[a-z0-9]+(?:-[a-z0-9]+)?/g) || [];'
          new='const rawTokens = (value: string): string[] => Array.from(clean(value).toLowerCase().match(/[a-z0-9]+(?:-[a-z0-9]+)?/g) || []);'
          if old not in s: raise SystemExit('rawTokens marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/fix-semantic-token-type.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/phi-semantic-expansion.ts .github/workflows/fix-semantic-token-type.yml
          git commit -m "Fix semantic token typing [skip ci]"
          git push
