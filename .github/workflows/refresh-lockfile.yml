name: Refresh NLP lockfile

on:
  push:
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          rm .github/workflows/refresh-lockfile.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lockfile.yml
          git commit -m "Lock forked NLP dependencies [skip ci]"
          git push
