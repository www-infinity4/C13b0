name: Apply Phi semantic page two encoded

on:
  push:
    paths:
      - .github/workflows/phi-semantic-page2-patch2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page two
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python /tmp/patch.py
          rm .github/workflows/phi-semantic-page2-patch2.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx .github/workflows/phi-semantic-page2-patch2.yml
          git commit -m "Rebuild page two as semantic expansion storyboard [skip ci]"
          git push
