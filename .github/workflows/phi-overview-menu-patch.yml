name: Patch Phi overview and embedded menu

on:
  push:
    paths:
      - ".github/workflows/phi-overview-menu-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch overview and SiteChrome menu bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/PhiPage2.tsx')
          s = p.read_text()
          old_story = '  const storyBeats = useMemo(() => paper ? makeStoryBeats(paper) : [], [paper]);'
          new_story = '  const storyBeats = useMemo(() => {\n    if (!paper || !researchNotes.length) return [];\n    const shapedPaper: Paper = {\n      ...paper,\n      overview: researchNotes.map((note) => note.body).slice(0, 3).join(" "),\n      findings: researchNotes.map((note) => note.body),\n    };\n    return makeStoryBeats(shapedPaper);\n  }, [paper, researchNotes]);'
          s = s.replace(old_story, new_story)
          s = s.replace('                  <h1>{paper.title}</h1>\n', '')
          s = s.replace('<div><h2 id="phi-discovery-heading">The full story · choose what to explain further</h2></div>\n                  <p>The orange cards are the readable story itself. Tap any part that matters to you and Phi researches that direction while keeping the original subject locked.</p>', '<div><h2 id="phi-discovery-heading">Research cards</h2></div>\n                  <p>The overview starts factual. These orange cards break the research into useful parts; choosing what matters is what begins shaping your story.</p>')
          s = s.replace('<div><h2 id="phi-story-heading">The full story</h2></div>\n                  <p>Read the clean baseline first. Expanding the story turns what you read into purple research notes without requiring you to make any orange-card decisions.</p>', '<div><h2 id="phi-story-heading">Story taking shape from your choices</h2></div>\n                  <p>This section appears only after your orange-card or research-note choices start defining what the article should actually explain.</p>')
          p.write_text(s)

          p = Path('src/components/SiteChrome.tsx')
          s = p.read_text()
          s = s.replace('[open, setOpen] = useState(false),', '[open, setOpen] = useState(false),\n    [embeddedMenu, setEmbeddedMenu] = useState(false),')
          marker = '  function show(p: "menu" | "wallet" | "history") {'
          bridge = '  useEffect(() => {\n    const embed = (event: Event) => {\n      const detail = (event as CustomEvent<{ embedded?: boolean }>).detail;\n      setEmbeddedMenu(Boolean(detail?.embedded));\n    };\n    const openFromShell = () => {\n      void refresh();\n      setPanel("menu");\n      setOpen(true);\n    };\n    window.addEventListener("infinity-shell-menu-ready", embed as EventListener);\n    window.addEventListener("infinity-open-menu", openFromShell);\n    return () => {\n      window.removeEventListener("infinity-shell-menu-ready", embed as EventListener);\n      window.removeEventListener("infinity-open-menu", openFromShell);\n    };\n  }, []);\n'
          if bridge not in s:
            s = s.replace(marker, bridge + marker)
          s = s.replace('      {focused && (\n', '      {focused && !embeddedMenu && (\n', 1)
          p.write_text(s)
          PY

          rm .github/workflows/phi-overview-menu-patch.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx src/components/SiteChrome.tsx .github/workflows/phi-overview-menu-patch.yml
          git commit -m "Make AI overview factual and attach landing menu [skip ci]"
          git push
