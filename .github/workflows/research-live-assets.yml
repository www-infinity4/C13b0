name: Verify live research assets
on:
  pull_request:
    paths: ['scripts/verify-research-live-assets.mjs', '.github/workflows/research-live-assets.yml']
  push:
    branches: [main]
    paths: ['scripts/verify-research-live-assets.mjs', '.github/workflows/research-live-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-research-live-assets.mjs
