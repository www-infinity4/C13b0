name: Remove obsolete Phi card code

on:
  push:
    paths:
      - .github/workflows/phi-remove-old-card-code.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete generator
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python /tmp/patch.py
          rm .github/workflows/phi-remove-old-card-code.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx src/lib/phi-semantic-expansion.ts .github/workflows/phi-remove-old-card-code.yml
          git commit -m "Remove obsolete hard-coded Phi card generator [skip ci]"
          git push
