name: Apply Phi publication dedupe

on:
  push:
    paths:
      - .github/workflows/phi-publication-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch clean publication
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python /tmp/patch.py
          rm .github/workflows/phi-publication-dedupe.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiMagazineV4.tsx src/components/SiteChrome.tsx .github/workflows/phi-publication-dedupe.yml
          git commit -m "Deduplicate Phi publication and add public menu [skip ci]"
          git push
