name: Wire Phi semantic gate

on:
  push:
    paths:
      - .github/workflows/phi-semantic-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phi research resolver
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python /tmp/patch.py
          rm .github/workflows/phi-semantic-gate-patch.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx .github/workflows/phi-semantic-gate-patch.yml
          git commit -m "Gate Phi research by subject semantics [skip ci]"
          git push
