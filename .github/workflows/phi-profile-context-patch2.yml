name: Wire Phi profile context 2

on:
  push:
    paths:
      - ".github/workflows/phi-profile-context-patch2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile context
        run: |
          echo '' | base64 -d >/tmp/profile_context.py
          python /tmp/profile_context.py
          rm .github/workflows/phi-profile-context-patch2.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx src/components/PhiCodeBuilderV2.tsx .github/workflows/phi-profile-context-patch2.yml
          git commit -m "Use saved profile context across Phi Search and Code [skip ci]"
          git push
