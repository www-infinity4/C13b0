name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-nextjs"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-nextjs
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages run to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "Waiting so the generated Jekyll Pages job cannot overwrite the Next.js site afterward."
          for i in $(seq 1 60); do
            state=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | .status' 2>/dev/null | head -n 1 || true)
            if [ -z "$state" ]; then
              if [ "$i" -ge 4 ]; then
                echo "No legacy Pages run detected; continuing."
                exit 0
              fi
            elif [ "$state" = "completed" ]; then
              echo "Legacy Pages run completed; Next.js will deploy last."
              exit 0
            else
              echo "Legacy Pages state: $state"
            fi
            sleep 5
          done
          echo "Timed out waiting for legacy Pages; deploying Next.js anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-nextjs
