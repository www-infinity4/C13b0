name: Deploy Infinity Phi Next.js Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "infinity-phi-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main application
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Infinity Phi
        run: npm run build
        env:
          GITHUB_PAGES: true
          NEXT_PUBLIC_PHI_SEARXNG_URL: ${{ vars.PHI_SEARXNG_URL }}

      - name: Verify actual website artifact
        shell: bash
        run: |
          test -d out || { echo "Missing Next.js out directory"; exit 1; }
          test -f out/index.html || { echo "Missing Infinity Phi index.html"; exit 1; }
          test -f out/phi/index.html || { echo "Missing Infinity Phi main page"; exit 1; }
          test -f out/phi/images/index.html || { echo "Missing Infinity Phi images page"; exit 1; }
          if grep -q '<h1.*README\|# C13b0' out/index.html 2>/dev/null; then
            echo "Refusing to publish README as the website"
            exit 1
          fi

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload only built Infinity Phi site
        uses: actions/upload-pages-artifact@v3
        with:
          name: infinity-phi-site
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy built Infinity Phi site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: infinity-phi-site
