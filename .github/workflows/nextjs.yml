name: Deploy Infinity Phi Next.js Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main application
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Infinity Phi
        run: npm run build
        env:
          GITHUB_PAGES: true
          NEXT_PUBLIC_PHI_SEARXNG_URL: ${{ vars.PHI_SEARXNG_URL }}

      - name: Verify Infinity Phi artifact
        shell: bash
        run: |
          test -f out/index.html || { echo "Missing Infinity Phi root index.html"; exit 1; }
          test -f out/phi/index.html || { echo "Missing Infinity Phi /phi page"; exit 1; }
          test -f out/phi/images/index.html || { echo "Missing Infinity Phi images page"; exit 1; }
          if grep -q '<h1.*README\|# C13b0' out/index.html 2>/dev/null; then
            echo "Refusing to publish README as the website"
            exit 1
          fi
          touch out/.nojekyll

      - name: Upload Infinity Phi Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Infinity Phi
        id: deployment
        uses: actions/deploy-pages@v4
