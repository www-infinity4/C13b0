name: Patch Phi page two story

on:
  push:
    paths:
      - ".github/workflows/phi-page2-story-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page two research story
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PhiPage2.tsx')
          s = p.read_text()

          s = s.replace(
            '  tungsten: { symbol: "W", number: 74 }, rhenium: { symbol: "Re", number: 75 }, platinum: { symbol: "Pt", number: 78 },',
            '  tungsten: { symbol: "W", number: 74 }, rhenium: { symbol: "Re", number: 75 }, platinum: { symbol: "Pt", number: 78 },\n  manganese: { symbol: "Mn", number: 25 }, technetium: { symbol: "Tc", number: 43 }, bohrium: { symbol: "Bh", number: 107 },'
          )

          marker = 'function intentionalTitle(query: string, identity: Identity) {'
          insert = '''function subjectRelevantLine(text: string, query: string, identity: Identity) {\n  const lower = clean(text).toLowerCase();\n  if (identity.kind === "element") {\n    const name = clean(identity.name).toLowerCase();\n    return Boolean(name && new RegExp(`\\\\b${name.replace(/[.*+?^${}()|[\\\\]\\\\]/g, "\\\\$&")}\\\\b`, "i").test(lower));\n  }\n  const anchors = [...wordSet(query)];\n  if (!anchors.length) return true;\n  const hits = anchors.filter((word) => lower.includes(word)).length;\n  return hits >= Math.min(2, anchors.length);\n}\n\n'''
          if insert not in s:
            s = s.replace(marker, insert + marker)

          s = s.replace(
            '  if (identity.kind === "element") return `${subject} in Context: Chemistry, Evidence, and the Questions That Matter`;',
            '  if (identity.kind === "element") return `${subject}: Atomic Structure, Chemistry, Evidence, and Open Questions`;'
          )

          old = '''  const records = sources.flatMap((source, sourceIndex) => splitSentences(source.excerpt).map((text) => ({ text, sourceIndex })));\n  const ranked = [...records].sort((a, b) => {'''
          new = '''  const allRecords = sources.flatMap((source, sourceIndex) => splitSentences(source.excerpt).map((text) => ({ text, sourceIndex })));\n  const subjectRecords = allRecords.filter((item) => subjectRelevantLine(item.text, query, identity));\n  const records = subjectRecords.length >= 3 ? subjectRecords : allRecords;\n  const ranked = [...records].sort((a, b) => {'''
          if old not in s:
            raise SystemExit('makePaper records marker not found')
          s = s.replace(old, new)

          marker2 = 'function intentionalTitle(query: string, identity: Identity) {'
          # storyDiscoveryTopics must come after discoveryTopics; insert immediately before intentionalTitle.
          story_fn = '''function storyDiscoveryTopics(paper: Paper): DiscoveryTopic[] {\n  const storyLines = dedupeLines([...splitSentences(paper.overview), ...paper.findings], 14);\n  const storyCards = storyLines.map((body, index) => {\n    const source = bestSourceFor(body, paper.sources);\n    const title = evidenceTitle(paper, body, source, index);\n    const keyword = [title, ...[...wordSet(body)].slice(0, 5)].join(" ");\n    return { key: `story-${index}-${body.length}`, title, body, keyword };\n  });\n  const used = new Set(storyCards.map((card) => card.title.toLowerCase()));\n  const guided = discoveryTopics(paper).filter((topic) => !used.has(topic.title.toLowerCase()));\n  return [...storyCards, ...guided].slice(0, 16);\n}\n\n'''
          if story_fn not in s:
            s = s.replace(marker2, story_fn + marker2)

          old_topics = '  const topics = useMemo(() => paper ? discoveryTopics(paper) : [], [paper]);'
          new_topics = '  const topics = useMemo(() => paper ? storyDiscoveryTopics(paper) : [], [paper]);'
          if old_topics not in s:
            raise SystemExit('topics marker not found')
          s = s.replace(old_topics, new_topics)

          s = s.replace(
            '<div><h2 id="phi-discovery-heading">Directions worth discovering</h2></div>\n                  <p>You do not need to know the expert vocabulary first. These orange cards teach the likely directions; choosing one researches it inside the same original subject.</p>',
            '<div><h2 id="phi-discovery-heading">The full story · choose what to explain further</h2></div>\n                  <p>The orange cards are the readable story itself. Tap any part that matters to you and Phi researches that direction while keeping the original subject locked.</p>'
          )

          # Remove the large lead image from the result page; images stay on orange/story cards.
          old_media = '''                <div className="phi-hero-media">\n                  {heroImage ? <img src={heroImage} alt={heroSource?.title || paper.title} /> : <div className="phi-hero-fallback">φ</div>}\n                  <div className="phi-hero-caption">{heroSource ? `${heroSource.provider} · ${heroSource.title}` : "Lead visual will strengthen as image-bearing research sources arrive."}</div>\n                </div>\n'''
          s = s.replace(old_media, '')

          p.write_text(s)
          PY

          rm .github/workflows/phi-page2-story-patch.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx .github/workflows/phi-page2-story-patch.yml
          git commit -m "Lock page two story to searched subject [skip ci]"
          git push
