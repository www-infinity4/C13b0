name: Repair Phi page two regression

on:
  push:
    paths:
      - .github/workflows/fix-page-two-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair page two and menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/components/PhiPage2.tsx')
          s=p.read_text()
          s=s.replace('Refine this subject · optional','Refine search · optional')
          s=s.replace('Make the subject more specific before you expand it','Add a more specific direction')
          s=re.sub(r'<p className="phi-base-conclusion">.*?</p>','',s,count=1,flags=re.S)
          s=s.replace('<small>Contextual keyword pass</small><b>Add as many specific directions as you need</b>','<small>Secondary search</small><b>Keep the same subject and make it more specific</b>')
          s=re.sub(r'<p className="phi-keyword-help">.*?</p>','',s,count=1,flags=re.S)
          s=s.replace('>Expand the overview<','>Explore further<')
          s=re.sub(r'<p>The overview only answers what the subject is\..*?</p>','',s,count=1,flags=re.S)
          s=re.sub(r'<p>These source-backed directions sit outside your current draft.*?</p>','',s,count=1,flags=re.S)
          s=re.sub(r'<p>Purple is the finalized editorial brief.*?</p>','',s,count=1,flags=re.S)
          s=s.replace('Choose an orange direction or add a specific refinement above. Phi will assemble those decisions into a non-repeating storyboard here.','The storyboard will appear after you choose an orange direction.')
          marker='<div className="phi-orange-grid">\n                  {topics.map((topic, index) => {'
          if marker in s and 'Retry subject research' not in s:
              s=s.replace(marker,'<div className="phi-orange-grid">\n                  {!topics.length && !busy && <div className="phi-purple-empty">No deeper cards returned from this source pass. <button type="button" onClick={() => void runSearch(paper.query, history)}>Retry subject research</button></div>}\n                  {topics.map((topic, index) => {',1)
          p.write_text(s)

          p=Path('src/components/SiteChrome.tsx')
          s=p.read_text()
          s=s.replace('bg-[linear-gradient(180deg,#071a34,#0a2b4b)]','bg-[linear-gradient(180deg,#071f16,#0b4129)]')
          s=s.replace('text-blue-200/55','text-emerald-200/65')
          s=s.replace('text-blue-200/60','text-emerald-200/65')
          p.write_text(s)
          PY
          rm .github/workflows/fix-page-two-regression.yml
          git config user.name "Infinity Phi Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PhiPage2.tsx src/components/SiteChrome.tsx .github/workflows/fix-page-two-regression.yml
          git commit -m "Repair page two cards and green menu [skip ci]"
          git push
