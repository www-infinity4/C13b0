<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Infinity Phi Images</title><meta name="description" content="Infinity Phi image search and selection workspace"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#171717}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fffffff2;border-bottom:1px solid #eee}a{color:#171717;font-weight:900;text-decoration:none}.count{background:#ffe64f;border:2px solid #d4b900;border-radius:999px;padding:8px 12px}.hero{max-width:1100px;margin:25px auto;padding:0 14px}.hero small{font-weight:1000;color:#6b5900;letter-spacing:.12em}.hero h1{font-size:clamp(2rem,8vw,4.5rem);line-height:.95;margin:8px 0}.hero p{color:#5c6470}.search{display:flex;gap:8px;margin-top:18px}.search input{flex:1;min-width:0;border:3px solid #e8c900;border-radius:16px;padding:14px;font-size:17px}.search button,.more{border:2px solid #d4b900;border-radius:16px;background:#ffe64f;padding:12px 17px;font-weight:1000}.grid{max-width:1300px;margin:auto;padding:0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.card{position:relative;border:3px solid transparent;border-radius:15px;overflow:hidden;background:#f4f2ec;padding:0;text-align:left;touch-action:manipulation}.card img{display:block;width:100%;height:220px;object-fit:cover;pointer-events:none}.copy{display:block;padding:8px;pointer-events:none}.copy b{display:block;font-size:13px}.copy small{display:block;color:#666;margin-top:4px}.card.selected{border-color:#d9b900;box-shadow:0 0 0 3px #ffe64f77}.check{display:none;position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:50%;background:#ffe64f;place-items:center;font-weight:1000}.selected .check{display:grid}.status{text-align:center;padding:30px;color:#666}.more{display:block;margin:25px auto 50px}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card img{height:180px}.search{display:grid}}</style></head><body><header><a href="/C13b0/phi/">← Infinity Phi</a><span class="count"><b id="count">0</b> selected</span></header><main><section class="hero"><small>INFINITY PHI IMAGES</small><h1 id="title">Image Search</h1><p>Tap any image to select it. Tap again to remove it. This page belongs only to Infinity Phi.</p><form class="search" id="form"><input id="q" placeholder="Search images" autocomplete="off"><button>Search Images</button></form></section><section class="grid" id="grid"></section><div class="status" id="status"></div><button class="more" id="more" hidden>Load more images ↓</button></main><script>(()=>{const KEY='infinity_phi_image_selections_v3',q=document.querySelector('#q'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),count=document.querySelector('#count'),title=document.querySelector('#title'),more=document.querySelector('#more');let active='',offset=0,selected=[];try{selected=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(selected))selected=[]}catch{selected=[]}const save=()=>{count.textContent=selected.length;try{localStorage.setItem(KEY,JSON.stringify(selected.slice(-250)))}catch{}};save();const clean=v=>String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();function toggle(item,card){const i=selected.findIndex(x=>x.id===item.id);if(i>=0)selected.splice(i,1);else selected.push(item);card.classList.toggle('selected',i<0);card.setAttribute('aria-pressed',i<0?'true':'false');save()}function render(items,append){if(!append)grid.innerHTML='';for(const item of items){const card=document.createElement('button');card.type='button';card.className='card'+(selected.some(x=>x.id===item.id)?' selected':'');card.setAttribute('aria-pressed',selected.some(x=>x.id===item.id)?'true':'false');const img=document.createElement('img');img.src=item.image;img.alt=item.title;img.loading='lazy';img.draggable=false;img.onerror=()=>{if(item.original&&img.src!==item.original)img.src=item.original};const copy=document.createElement('span');copy.className='copy';const b=document.createElement('b');b.textContent=item.title;copy.appendChild(b);if(item.description){const s=document.createElement('small');s.textContent=item.description.slice(0,130);copy.appendChild(s)}const check=document.createElement('i');check.className='check';check.textContent='✓';card.append(img,copy,check);card.addEventListener('click',e=>{e.preventDefault();toggle(item,card)});grid.appendChild(card)}}async function search(term,next=0,append=false){if(!term)return;status.textContent='Finding images…';more.hidden=true;try{const p=new URLSearchParams({action:'query',generator:'search',gsrsearch:term,gsrnamespace:'6',gsrlimit:'50',gsroffset:String(next),prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'1200',format:'json',origin:'*'});const r=await fetch('https://commons.wikimedia.org/w/api.php?'+p,{cache:'no-store'});const j=await r.json();const items=Object.values(j.query?.pages||{}).map(raw=>{const info=raw.imageinfo?.[0]||{},meta=info.extmetadata||{},original=clean(info.url),image=clean(info.thumburl)||original;return{id:String(raw.pageid||original||image),image,original,title:clean(String(raw.title||'').replace(/^File:/,''))||term,sourceUrl:clean(info.descriptionurl),provider:'Wikimedia Commons',description:clean(meta.ImageDescription?.value||meta.ObjectName?.value||'')}}).filter(x=>x.image);render(items,append);offset=next;status.textContent=items.length?'':'No images returned. Try another wording.';more.hidden=!items.length}catch(e){status.textContent='Image search did not finish. Tap Search Images to retry.'}}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();active=clean(q.value);if(!active)return;offset=0;title.textContent='Images for '+active;history.replaceState({},'',location.pathname+'?q='+encodeURIComponent(active));search(active,0,false)});more.addEventListener('click',()=>search(active,offset+50,true));const initial=clean(new URLSearchParams(location.search).get('q'));if(initial){q.value=active=initial;title.textContent='Images for '+active;search(active,0,false)}})();</script></body></html>
